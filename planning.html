<script>
const SB_URL = 'https://htprfzzqjqfzyqcbjynz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cHJmenpxanFmenlxY2JqeW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTI1MTEsImV4cCI6MjA5OTg2ODUxMX0.HtHvc7_OGAidJ0XSnlKnx3d6tfrPTxbkFUaLsEv5nbE';
const SB_H = {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};

const START=new Date('2026-09-12'), T1=new Date('2027-04-18'), END=new Date('2027-04-30');
const INSCR_END=new Date('2027-03-07'), XMAS_S=new Date('2026-12-19'), XMAS_E=new Date('2027-01-04');
const PORTES_IMM=50, PORTES_PAV=20;
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS=['jan','fév','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

let sessions=[], addresses=[], bureauStats={}, visites={}, planningRef=[];

async function loadAll() {
    const [sR,vR,aR,bR,prR] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`,{headers:SB_H}),
        fetch(`${SB_URL}/rest/v1/visites?select=*`,{headers:SB_H}),
        fetch('adresses_nanterre.json'), fetch('bureau_stats_calendrier.json'),
        fetch(`${SB_URL}/rest/v1/planning_reference?select=*&order=date`,{headers:SB_H}),
    ]);
    sessions = await sR.json();
    const vRows = await vR.json();
    if (Array.isArray(vRows)) vRows.forEach(r => {
        if (!visites[r.address_id]) visites[r.address_id] = {};
        visites[r.address_id][r.type] = {count:r.count||1, status:r.status||'approved'};
    });
    addresses = await aR.json();
    bureauStats = await bR.json();
    planningRef = await prR.json();
}

// === ALGO DE PLANIFICATION (pool global, pas par bureau) ===
function visitCount(addrId) {
    const v = visites[addrId];
    if (!v || !v.pap || v.pap.status !== 'approved') return 0;
    return v.pap.count;
}

function dist(a,b) { return Math.sqrt((a.lat-b.lat)**2+(a.lon-b.lon)**2); }

const SEUIL_LGTS = 10;
const BASCULE_P2 = new Date('2027-02-01');

function buildPoolT1() {
    // Adresses 10+ lgts pas encore visitées, triées par score_recup × logements
    const pool = [];
    for (const a of addresses) {
        if (!a.bv || !bureauStats[a.bv]) continue;
        const lgts = a.lgts || 1;
        if (lgts < SEUIL_LGTS) continue;
        if (visitCount(a.id) >= 1) continue; // déjà fait sur le terrain
        const bs = bureauStats[a.bv];
        pool.push({...a, score: bs.score_recup * lgts, bureau: a.bv});
    }
    pool.sort((a, b) => b.score - a.score);
    return pool;
}

function buildPoolT2() {
    // Toutes les adresses 10+ lgts, triées par gain_voix_bureau × logements
    const pool = [];
    for (const a of addresses) {
        if (!a.bv || !bureauStats[a.bv]) continue;
        const lgts = a.lgts || 1;
        if (lgts < SEUIL_LGTS) continue;
        const bs = bureauStats[a.bv];
        const scoreT2 = (bs.gain_voix || 0) * lgts;
        if (scoreT2 <= 0) continue;
        pool.push({...a, score: scoreT2, scoreT2, bureau: a.bv});
    }
    pool.sort((a, b) => b.score - a.score);
    return pool;
}

function pickSession(pool, capacity, usedZones) {
    if (!pool.length) return [];
    // Zone = grille ~200m pour diversifier
    let seedIdx=-1;
    for (let i=0;i<pool.length;i++) {
        const z=`${Math.round(pool[i].lat*500)}_${Math.round(pool[i].lon*500)}`;
        if (!usedZones.has(z)) { seedIdx=i; break; }
    }
    if (seedIdx<0) seedIdx=0;
    const seed=pool[seedIdx];
    const selected=[seed];
    const used=new Set([seedIdx]);
    let left=capacity-(seed.lgts||1);

    while (left>0 && used.size<pool.length) {
        const last=selected[selected.length-1];
        let bi=-1, bv=-Infinity;
        for (let i=0;i<pool.length;i++) {
            if (used.has(i)) continue;
            const d=dist(last,pool[i]);
            if (d>0.004) continue;
            const v=(pool[i].lgts||1)/(d+0.00005);
            if (v>bv) { bv=v; bi=i; }
        }
        if (bi<0) break;
        selected.push(pool[bi]);
        used.add(bi);
        left-=(pool[bi].lgts||1);
    }
    // Retirer du pool
    [...used].sort((a,b)=>b-a).forEach(i=>pool.splice(i,1));
    // Marquer la zone
    usedZones.add(`${Math.round(seed.lat*500)}_${Math.round(seed.lon*500)}`);
    return selected;
}

function sessionsPerWeek(d) {
    if (d>=XMAS_S && d<=XMAS_E) return 1;
    const w=(T1-d)/(7*864e5);
    if (w>28) return 3; if (w>20) return 3; if (w>12) return 5;
    if (w>4) return 10; return 20;
}
function milPerSession(d, isWe) {
    const w=(T1-d)/(7*864e5);
    if (isWe) return w>20?6:w>8?7:8;
    return w>20?3:w>8?4:5;
}

let weekCounter = 0;
function scheduleWeek(ws, n) {
    const slots = [];
    // Samedi toujours inclus
    const sam = new Date(ws); sam.setDate(sam.getDate()+(6-sam.getDay()));
    slots.push({date:new Date(sam), isWe:true});

    // Soirs lun-ven : rotation d'une semaine à l'autre
    // Semaine 0: lun, mer, ven | Semaine 1: mar, jeu | Semaine 2: lun, mer, ven | etc.
    const soirPatterns = [
        [1, 3],     // lun, mer
        [2, 5],     // mar, ven
        [3, 4],     // mer, jeu
        [1, 5],     // lun, ven
        [2, 4],     // mar, jeu
        [4, 5],     // jeu, ven
        [1, 2],     // lun, mar
        [3, 5],     // mer, ven
    ];
    const pattern = soirPatterns[weekCounter % soirPatterns.length];
    weekCounter++;

    for (const d of pattern) {
        const dt = new Date(ws);
        dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
        slots.push({date: new Date(dt), isWe: false});
    }

    // Si > 6 sessions : ajouter les jours manquants
    if (n > slots.length) {
        for (const d of [1,2,3,4,5]) {
            const dt = new Date(ws);
            dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
            if (!slots.some(s => s.date.getTime() === dt.getTime()))
                slots.push({date: new Date(dt), isWe: false});
        }
    }
    // Si > 6 sessions : dupliquer (sessions simultanées)
    if (n > 6) {
        const base = slots.filter(s => !s.isWe);
        for (const s of base) slots.push({date: new Date(s.date), isWe: false});
    }
    // Si > 12 : dimanche
    if (n > 12) {
        const dim = new Date(ws); dim.setDate(dim.getDate()+(7-dim.getDay()));
        slots.push({date: dim, isWe: true});
    }
    // Extra samedis simultanés en fin de campagne
    const wToT1 = (T1-ws)/(7*864e5);
    if (wToT1 <= 6 && wToT1 > 0) {
        const extra = wToT1 <= 3 ? 2 : 1;
        for (let i = 0; i < extra; i++) slots.push({date: new Date(sam), isWe: true});
    }
    return slots.slice(0, n);
}

async function recalculate() {
    const btn=document.getElementById('ubtn');
    btn.disabled=true; btn.textContent='Calcul en cours...';

    await fetch(`${SB_URL}/rest/v1/sessions?id=gt.0`,{method:'DELETE',headers:SB_H});

    const today=new Date(); today.setHours(0,0,0,0);
    const startDate = today > START ? today : START;
    const poolPhase1 = buildPoolT1();
    const p1PlannedDates = {};
    const p2Used = new Set();
    const GAP_MS = 90 * 24 * 3600 * 1000; // 3 mois

    // Calculer le budget total en logements (somme de toutes les sessions possibles)
    let totalBudget = 0;
    let tempWs = new Date(startDate);
    tempWs.setDate(tempWs.getDate() - tempWs.getDay() + 1);
    while (tempWs < T1) {
        if (tempWs.getTime() + 6*864e5 >= startDate.getTime()) {
            const n = sessionsPerWeek(tempWs);
            const slots = scheduleWeek(tempWs, n);
            for (const sl of slots) {
                if (sl.date >= startDate && sl.date < T1) {
                    const nm = milPerSession(sl.date, sl.isWe);
                    totalBudget += nm * PORTES_IMM; // estimation haute
                }
            }
        }
        tempWs.setDate(tempWs.getDate() + 7);
    }
    weekCounter = 0; // reset le compteur de semaines après le calcul

    // Budget P1 = 50% du total - portes déjà faites sur le terrain
    let portesTerrain = 0;
    for (const [id, v] of Object.entries(visites)) {
        if (v.pap && v.pap.status === 'approved') {
            const a = addresses.find(x => x.id === id);
            if (a && (a.lgts||1) >= SEUIL_LGTS) portesTerrain += (a.lgts||1);
        }
    }
    const budgetP1 = Math.max(0, Math.round(totalBudget / 2) - portesTerrain);
    let p1Remaining = budgetP1;
    let inP2 = false;

    // Pool T2 : exclure seulement les adresses qui auront eu 2 passages (P1 + P2)
    // Calculé après la boucle P1/P2, donc on le construit juste avant la phase 3
    let poolPhase3 = [];

    const newSessions = [];
    let ws = new Date(startDate);
    ws.setDate(ws.getDate() - ws.getDay() + 1);

    while (ws < END) {
        if (ws.getTime()+6*864e5 < startDate.getTime()) { ws.setDate(ws.getDate()+7); continue; }

        const isPostT1 = ws >= T1;
        const n = isPostT1 ? 20 : sessionsPerWeek(ws);
        const slots = scheduleWeek(ws, n);
        const usedZones = new Set();

        for (const slot of slots) {
            if (slot.date < startDate || slot.date > END) continue;

            const nMil = milPerSession(slot.date, slot.isWe);
            let pool, passage, phaseLabel;
            if (isPostT1) {
                // Construire le pool T2 au premier passage (exclure seulement les adresses avec 2 passages)
                if (!poolPhase3.length) {
                    const doneP2 = p2Used; // adresses ayant eu P1 + P2
                    poolPhase3 = buildPoolT2().filter(a => !doneP2.has(a.id));
                }
                pool = poolPhase3; passage = 1;
                phaseLabel = 'Entre-deux-tours — Front républicain';
            } else {
                // Bascule P1→P2 quand le budget P1 est épuisé
                if (!inP2 && p1Remaining <= 0) inP2 = true;

                if (inP2) {
                    // P2 : tout le pool 10+ lgts sauf :
                    // - déjà planifié en P2 cette session
                    // - visitCount >= 2 (déjà 2 passages terrain)
                    // - planifié en P1 il y a moins de 3 mois (gap)
                    const poolP2now = [];
                    for (const a of addresses) {
                        if (p2Used.has(a.id)) continue;
                        if (!a.bv || !bureauStats[a.bv]) continue;
                        if ((a.lgts||1) < SEUIL_LGTS) continue;
                        if (visitCount(a.id) >= 2) continue;
                        // Vérifier le gap de 3 mois si planifié en P1
                        const p1Date = p1PlannedDates[a.id];
                        if (p1Date && slot.date.getTime() - p1Date.getTime() < GAP_MS) continue;
                        const bs = bureauStats[a.bv];
                        poolP2now.push({...a, score: bs.score_recup * (a.lgts||1), bureau: a.bv});
                    }
                    poolP2now.sort((a,b) => b.score - a.score);
                    if (poolP2now.length > 0) {
                        pool = poolP2now; passage = 2;
                    } else {
                        pool = poolPhase1; passage = 1; // fallback si rien éligible en P2
                    }
                } else {
                    pool = poolPhase1; passage = 1;
                }
                phaseLabel = slot.date < INSCR_END ? 'Inscriptions + sensibilisation' : '1er tour — Vote utile Mélenchon';
            }
            if (!pool.length) continue;

            // Capacité + 40% de marge pour que les militants aient toujours un bâtiment suivant
            const firstLgts = pool[0]?.lgts || 1;
            const capacity = Math.round(nMil * (firstLgts >= 6 ? PORTES_IMM : PORTES_PAV) * 1.4);

            const selected = pickSession(pool, capacity, usedZones);
            if (!selected.length) continue;

            // Enregistrer les dates P1, décrémenter le budget, marquer P2
            for (const a of selected) {
                if (passage === 1 && !isPostT1) {
                    p1PlannedDates[a.id] = new Date(slot.date);
                    p1Remaining -= (a.lgts || 1);
                } else if (passage === 2) {
                    p2Used.add(a.id);
                }
            }

            const totalLgts = selected.reduce((s,a)=>s+(a.lgts||1),0);
            const addrList = selected.map(a=>`${a.adr} (~${a.lgts||1})`).join(' | ');
            const bureau = selected[0].bureau;

            newSessions.push({
                date: slot.date.toISOString().split('T')[0],
                bureau, phase: phaseLabel,
                type: slot.isWe ? 'Weekend' : 'Soir',
                adresses_cibles: addrList,
                portes_estimees: totalLgts,
                statut: 'planned',
                notes: `Passage ${passage} · ${selected.length} adresses · ${nMil} militants`,
            });
        }
        ws.setDate(ws.getDate()+7);
    }

    for (let i=0; i<newSessions.length; i+=50) {
        await fetch(`${SB_URL}/rest/v1/sessions`,{
            method:'POST', headers:SB_H, body:JSON.stringify(newSessions.slice(i,i+50))
        });
    }

    sessions = await (await fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`,{headers:SB_H})).json();

    // Sauvegarder la courbe de référence seulement si elle n'existe pas encore
    if (!planningRef.length && newSessions.length) {
        // Construire la courbe cumulée jour par jour
        const byDate = {};
        for (const s of newSessions) {
            byDate[s.date] = (byDate[s.date] || 0) + s.portes_estimees;
        }
        const dates = Object.keys(byDate).sort();
        let cumul = 0;
        const refRows = [];
        for (const d of dates) {
            cumul += byDate[d];
            refRows.push({ date: d, portes_cumulees: cumul });
        }
        // Insérer par batches
        for (let i = 0; i < refRows.length; i += 50) {
            await fetch(`${SB_URL}/rest/v1/planning_reference`, {
                method: 'POST', headers: SB_H,
                body: JSON.stringify(refRows.slice(i, i + 50))
            });
        }
        planningRef = refRows;
    }

    btn.disabled=false; btn.textContent='Mettre à jour le planning';
    render();
}

// === RENDER ===
function render() { renderTimeline(); renderStats(); renderSessions(); }

function renderTimeline() {
    const total = END - START;
    const now = new Date();
    const nW = Math.max(0, Math.min(100, (now - START) / total * 100));

    // Trouver la vraie date de bascule P1→P2 depuis les sessions
    let p2Start = T1;
    for (const s of sessions) {
        if (s.notes && s.notes.includes('Passage 2')) {
            p2Start = new Date(s.date);
            break;
        }
    }

    const p1W = (p2Start - START) / total * 100;
    const p2W = (T1 - p2Start) / total * 100;
    const t2W = (END - T1) / total * 100;
    const fmt = d => `${d.getDate()}/${d.getMonth()+1}`;

    // Curseur "Aujourd'hui"
    const cursorHTML = now >= START && now <= END
        ? `<div class="timeline-marker" style="left:${nW}%">
             <div class="timeline-cursor-label">Aujourd'hui</div>
           </div>` : '';

    document.getElementById('tbar').innerHTML = `
        <div class="timeline-phase inscr" style="width:${p1W}%">Passage 1</div>
        <div class="timeline-phase t1" style="width:${p2W}%">Passage 2</div>
        <div class="timeline-phase t2" style="width:${t2W}%">Front rép.</div>
        ${cursorHTML}`;

    document.getElementById('tlabels').innerHTML = `
        <span style="width:${p1W}%">${fmt(START)} → ${fmt(p2Start)}</span>
        <span style="width:${p2W}%">→ ${fmt(T1)}</span>
        <span style="width:${t2W}%">→ ${fmt(END)}</span>`;

    renderPaceIndicator(now);
}

function renderPaceIndicator(now) {
    if (now < START || now > END) return;

    // Portes terrain réellement faites
    let portesFaites = 0;
    for (const [id, v] of Object.entries(visites)) {
        if (v.pap && v.pap.status === 'approved') {
            const a = addresses.find(x => x.id === id);
            portesFaites += a ? (a.lgts || 1) : 1;
        }
    }

    // Portes attendues selon la courbe de référence initiale
    let portesAttendues = 0;
    const todayStr = now.toISOString().split('T')[0];
    if (planningRef.length) {
        for (const r of planningRef) {
            if (r.date <= todayStr) portesAttendues = r.portes_cumulees;
            else break;
        }
    } else {
        // Pas encore de référence — pas d'indicateur
        return;
    }

    const delta = portesFaites - portesAttendues;
    const totalRef = planningRef[planningRef.length - 1]?.portes_cumulees || 1;

    let statusColor, statusText;
    if (delta >= 0) {
        statusColor = 'var(--lfi-green)';
        statusText = `En avance de ${delta.toLocaleString()} portes`;
    } else {
        statusColor = 'var(--lfi-red)';
        statusText = `En retard de ${Math.abs(delta).toLocaleString()} portes`;
    }

    let paceEl = document.getElementById('pace-indicator');
    if (!paceEl) {
        paceEl = document.createElement('div');
        paceEl.id = 'pace-indicator';
        paceEl.style.cssText = 'padding:6px 20px;font-size:12px;font-weight:600;text-align:center;';
        document.querySelector('.timeline').appendChild(paceEl);
    }
    paceEl.style.color = statusColor;
    paceEl.innerHTML = `${statusText} — ${portesFaites.toLocaleString()} faites / ${portesAttendues.toLocaleString()} prévues au plan initial`;
}

function renderStats() {
    const nSess=sessions.length;
    const portesP=sessions.reduce((s,x)=>s+(x.portes_estimees||0),0);
    let portesFaites=0;
    for (const [id,v] of Object.entries(visites)) {
        if (v.pap&&v.pap.status==='approved') { const a=addresses.find(x=>x.id===id); portesFaites+=a?(a.lgts||1):1; }
    }
    document.getElementById('stats').innerHTML=`
        <div class="stat-card"><div class="num">${nSess}</div><div class="label">Sessions</div></div>
        <div class="stat-card"><div class="num">${portesP.toLocaleString()}</div><div class="label">Portes planifiées</div></div>
        <div class="stat-card"><div class="num">${portesFaites.toLocaleString()}</div><div class="label">Portes terrain</div></div>`;
}

function renderAddrs(cibles, sessionId) {
    if (!cibles) return '';
    const addrs = cibles.split(' | ');
    const SHOW = 3;
    if (addrs.length <= SHOW) {
        return `<div class="sc-addrs">${addrs.map(a => `<div class="addr-item">${a}</div>`).join('')}</div>`;
    }
    const visible = addrs.slice(0, SHOW).map(a => `<div class="addr-item">${a}</div>`).join('');
    const hidden = addrs.slice(SHOW).map(a => `<div class="addr-item">${a}</div>`).join('');
    return `<div class="sc-addrs">
        ${visible}
        <div id="more-${sessionId}" style="display:none;">${hidden}</div>
        <div class="sc-toggle" onclick="
            var el=document.getElementById('more-${sessionId}');
            var open=el.style.display!=='none';
            el.style.display=open?'none':'block';
            this.textContent=open?'Voir les ${addrs.length - SHOW} autres adresses ▼':'Masquer ▲';
        ">Voir les ${addrs.length - SHOW} autres adresses ▼</div>
    </div>`;
}

function renderSessions() {
    let html='', lastW='';
    for (const s of sessions) {
        const d=new Date(s.date);
        const wn=Math.floor((d-START)/(7*864e5))+1, wk=`S${wn}`;
        if (wk!==lastW) {
            const ws2=new Date(START.getTime()+(wn-1)*7*864e5);
            const we2=new Date(ws2.getTime()+6*864e5);
            const fmt=dt=>`${dt.getDate()} ${MOIS[dt.getMonth()]}`;
            html+=`<div class="week-header">${wk} — ${fmt(ws2)} au ${fmt(we2)}</div>`;
            lastW=wk;
        }
        const jour=JOURS[d.getDay()], dateStr=`${jour} ${d.getDate()} ${MOIS[d.getMonth()]}`;
        const pCls=s.phase.includes('Inscr')?'inscr':s.phase.includes('1er')?'t1':'t2';
        const pShort=s.phase.includes('Inscr')?'Inscriptions':s.phase.includes('1er')?'1er tour':'Front rép.';
        const passageNum = s.notes && s.notes.includes('Passage 2') ? 2 : 1;

        html+=`<div class="session-card">
            <div class="sc-top">
                <span class="sc-date">${dateStr} · ${s.type}</span>
                <span class="sc-badge ${pCls}">${pShort}</span>
            </div>
            <div class="sc-top" style="margin-top:2px;">
                <span class="sc-bureau">Bureau ${s.bureau}</span>
                <span class="sc-badge ${passageNum===1?'p1':'p2'}">Passage ${passageNum}</span>
            </div>
            ${renderAddrs(s.adresses_cibles, s.id)}
            <div class="sc-summary"><b>${s.portes_estimees}</b> logements · ${s.notes||''}</div>
        </div>`;
    }
    document.getElementById('sessions').innerHTML=html||'<p style="padding:20px;color:#999;">Cliquez "Mettre à jour" pour générer le planning.</p>';
}

document.addEventListener('click',e=>{
    if(!e.target.closest('.nav-menu-btn')&&!e.target.closest('.nav-dropdown'))
        document.getElementById('nav-dropdown').classList.remove('open');
});

async function init() { await loadAll(); render(); }
init();
</script>
