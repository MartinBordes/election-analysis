<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planning PAP — Nanterre</title>
<style>
@font-face { font-family: 'Union Gothic'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/union_gothic-variable.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'Stack Sans'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/StackSansText-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Stack Sans'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/StackSansText-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

:root {
    --lfi-violet: #4C0297; --lfi-red: #D1271C; --lfi-yellow: #FFD301;
    --lfi-noir: #212320; --lfi-blanc: #FFFCF4; --lfi-gris: #F5F5F5;
    --lfi-gris2: #707070; --lfi-violet-light: #E5CBFF; --lfi-red-light: #FFD2CF;
    --lfi-green: #186842; --lfi-green-light: #EDFBF3; --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Stack Sans', Arial, sans-serif; color: var(--lfi-noir); background: var(--lfi-blanc); }

.header { background: var(--lfi-violet); color: white; padding: 16px 20px 12px; }
.header h1 { font-family: 'Union Gothic', sans-serif; font-size: 22px; text-transform: uppercase; }
.header .sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }

/* Timeline */
.timeline { padding: 12px 20px; background: white; border-bottom: 1px solid #eee; overflow-x: auto; }
.timeline-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; min-width: 500px; position: relative; }
.timeline-phase { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; white-space: nowrap; }
.timeline-phase.inscr { background: var(--lfi-red); }
.timeline-phase.t1 { background: var(--lfi-violet); }
.timeline-phase.t2 { background: var(--lfi-noir); }
.timeline-marker { position: absolute; top: -4px; width: 3px; height: 36px; background: var(--lfi-yellow); border-radius: 2px; }
.timeline-dates { font-size: 10px; color: var(--lfi-gris2); margin-top: 4px; display: flex; justify-content: space-between; min-width: 500px; }

/* Stats row */
.stats { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; }
.stat-card { flex: 1; min-width: 90px; background: white; border: 1.5px solid var(--lfi-violet-light); border-radius: var(--radius); padding: 10px; text-align: center; }
.stat-card .num { font-family: 'Union Gothic', sans-serif; font-size: 26px; color: var(--lfi-violet); }
.stat-card .label { font-size: 11px; color: var(--lfi-gris2); margin-top: 2px; }
.stat-card .bar { height: 5px; background: #eee; border-radius: 3px; margin-top: 6px; }
.stat-card .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.stat-card .bar-fill.violet { background: var(--lfi-violet); }
.stat-card .bar-fill.green { background: var(--lfi-green); }

/* Update button */
.update-row { padding: 10px 20px; }
.update-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius);
    background: var(--lfi-violet); color: white; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(76,2,151,0.3);
}
.update-btn:active { transform: scale(0.98); }
.update-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Sessions */
.sessions { padding: 0 20px 100px; }
.week-header { font-family: 'Union Gothic', sans-serif; font-size: 15px; color: var(--lfi-violet); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--lfi-violet-light); }
.session-card { background: white; border: 1.5px solid #eee; border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px; }
.sc-top { display: flex; justify-content: space-between; align-items: center; }
.sc-date { font-weight: 700; font-size: 14px; }
.sc-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.sc-badge.inscr { background: var(--lfi-red-light); color: var(--lfi-red); }
.sc-badge.t1 { background: var(--lfi-violet-light); color: var(--lfi-violet); }
.sc-badge.t2 { background: #eee; color: var(--lfi-noir); }
.sc-bureau { font-size: 12px; color: var(--lfi-gris2); margin-top: 3px; }
.sc-addr { font-size: 12px; margin-top: 2px; line-height: 1.4; }
.sc-portes { font-size: 12px; color: var(--lfi-gris2); margin-top: 3px; }
.sc-portes b { color: var(--lfi-noir); }
.sc-progress { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.sc-progress .bar { flex: 1; height: 5px; background: #eee; border-radius: 3px; }
.sc-progress .bar-fill { height: 100%; border-radius: 3px; background: var(--lfi-green); }
.sc-progress .pct { font-size: 11px; font-weight: 700; color: var(--lfi-green); }

/* Nav */
.nav-menu-btn { position: fixed; top: 10px; right: 10px; z-index: 10000; width: 44px; height: 44px; border: 1.5px solid var(--lfi-violet-light); border-radius: 50%; background: rgba(255,252,244,0.95); color: var(--lfi-violet); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(76,2,151,0.2); }
.nav-dropdown { display: none; position: fixed; top: 62px; right: 10px; z-index: 10000; background: rgba(255,252,244,0.97); border-radius: 10px; border: 1.5px solid var(--lfi-violet-light); box-shadow: 0 4px 16px rgba(76,2,151,0.2); overflow: hidden; min-width: 160px; }
.nav-dropdown.open { display: block; }
.nav-dropdown a { display: block; padding: 12px 16px; color: var(--lfi-violet); text-decoration: none; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--lfi-violet-light); }
.nav-dropdown a:last-child { border-bottom: none; }
.nav-dropdown a:hover { background: var(--lfi-violet-light); }
.nav-dropdown a.current { background: var(--lfi-violet); color: white; }
.nav-dropdown .nav-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 8px 16px; color: var(--lfi-gris2); border-bottom: 1px solid var(--lfi-violet-light); }
</style>
</head>
<body>

<div class="header">
    <h1>Planning PAP</h1>
    <div class="sub">Nanterre — Septembre 2026 → Avril 2027</div>
</div>

<div class="timeline">
    <div class="timeline-bar" id="timeline-bar"></div>
    <div class="timeline-dates" id="timeline-dates"></div>
</div>

<div class="stats" id="stats"></div>

<div class="update-row">
    <button class="update-btn" id="update-btn" onclick="recalculate()">
        Mettre à jour le planning
    </button>
</div>

<div class="sessions" id="sessions"></div>

<button class="nav-menu-btn" onclick="document.getElementById('nav-dropdown').classList.toggle('open')">&#9776;</button>
<div class="nav-dropdown" id="nav-dropdown">
    <div class="nav-badge">Navigation</div>
    <a href="porte-a-porte.html?mode=admin">Terrain</a>
    <a href="1er_tour.html">Carte 1er tour</a>
    <a href="2nd_tour.html">Carte 2nd tour</a>
    <a href="planning.html" class="current">Planning</a>
</div>

<script>
const SB_URL = 'https://htprfzzqjqfzyqcbjynz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cHJmenpxanFmenlxY2JqeW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTI1MTEsImV4cCI6MjA5OTg2ODUxMX0.HtHvc7_OGAidJ0XSnlKnx3d6tfrPTxbkFUaLsEv5nbE';
const SB_H = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

const START = new Date('2026-09-12');
const T1 = new Date('2027-04-18');
const END = new Date('2027-04-30');
const INSCR_END = new Date('2027-03-07');
const XMAS_START = new Date('2026-12-19');
const XMAS_END = new Date('2027-01-04');

const PORTES_IMM = 50, PORTES_PAV = 20;
const SOIR_DAYS = [1, 2, 3, 4]; // lun-jeu
const JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS = ['jan','fév','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

let sessions = [];
let visites = {};
let addresses = [];
let bureauStats = {};

async function loadAll() {
    const [sessR, visR, addrR, bsR] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`, { headers: SB_H }),
        fetch(`${SB_URL}/rest/v1/visites?select=*`, { headers: SB_H }),
        fetch('adresses_nanterre.json'),
        fetch('bureau_stats_calendrier.json'),
    ]);
    sessions = await sessR.json();
    const visRows = await visR.json();
    if (Array.isArray(visRows)) visRows.forEach(r => {
        if (!visites[r.address_id]) visites[r.address_id] = {};
        visites[r.address_id][r.type] = { count: r.count || 1, status: r.status || 'approved' };
    });
    addresses = await addrR.json();
    bureauStats = await bsR.json();
}

// Portes déjà faites (approuvées) par bureau
function portesFaites(bureau) {
    let total = 0;
    for (const [id, v] of Object.entries(visites)) {
        const a = addresses.find(x => x.id === id);
        if (!a) continue;
        // On utilise le bureau pré-calculé si disponible
        const aBureau = a._bureau;
        if (aBureau !== undefined && aBureau !== bureau) continue;
        if (aBureau === undefined) continue;
        if (v.pap && v.pap.status === 'approved') total += (a.lgts || 1);
    }
    return total;
}

function sessionsPerWeek(date) {
    if (date >= XMAS_START && date <= XMAS_END) return 1;
    const w = (T1 - date) / (7 * 86400000);
    if (w > 28) return 3;
    if (w > 20) return 3;
    if (w > 12) return 5;
    if (w > 4) return 10;
    return 20;
}

function militantsPerSession(date, isWeekend) {
    const w = (T1 - date) / (7 * 86400000);
    if (isWeekend) return w > 20 ? 6 : w > 8 ? 7 : 8;
    return w > 20 ? 3 : w > 8 ? 4 : 5;
}

function scheduleWeek(weekStart, n) {
    const slots = [];
    // Samedi
    const sam = new Date(weekStart); sam.setDate(sam.getDate() + (6 - sam.getDay()));
    slots.push({ date: new Date(sam), isWeekend: true });
    // Soirs lun-ven
    for (const d of [1,2,3,4,5]) {
        const dt = new Date(weekStart);
        dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
        if (dt >= weekStart) slots.push({ date: dt, isWeekend: false });
    }
    // Dupliquer si besoin
    if (n > 6) {
        for (const d of [1,2,3,4,5]) {
            const dt = new Date(weekStart);
            dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
            slots.push({ date: new Date(dt), isWeekend: false });
        }
    }
    if (n > 11) {
        const dim = new Date(weekStart); dim.setDate(dim.getDate() + (7 - dim.getDay()));
        slots.push({ date: dim, isWeekend: true });
        for (const d of [1,2,3,4,5]) {
            const dt = new Date(weekStart);
            dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
            slots.push({ date: new Date(dt), isWeekend: false });
        }
    }
    return slots.slice(0, n);
}

async function recalculate() {
    const btn = document.getElementById('update-btn');
    btn.disabled = true;
    btn.textContent = 'Calcul en cours...';

    // Supprimer toutes les sessions existantes
    await fetch(`${SB_URL}/rest/v1/sessions?id=gt.0`, { method: 'DELETE', headers: SB_H });

    const today = new Date();
    today.setHours(0,0,0,0);
    const startDate = today > START ? today : START;

    // Calculer les portes restantes par bureau
    const remaining = {};
    for (const [bid, s] of Object.entries(bureauStats)) {
        const fait = portesFaites(parseInt(bid));
        const total = s.lgts_immeubles + s.nb_pavillons;
        remaining[bid] = Math.max(0, total - fait);
    }

    // Trier les bureaux par priorité (score récup pour T1, gain voix pour T2)
    const t1sorted = Object.keys(bureauStats).sort((a, b) => {
        const ra = remaining[a] > 0 ? bureauStats[b].score_recup - bureauStats[a].score_recup : Infinity;
        return bureauStats[b].score_recup * (remaining[b] > 0 ? 1 : 0.1)
             - bureauStats[a].score_recup * (remaining[a] > 0 ? 1 : 0.1);
    }).slice(0, 20);

    const t2sorted = Object.keys(bureauStats).sort((a, b) =>
        bureauStats[b].gain_voix - bureauStats[a].gain_voix
    ).slice(0, 15);

    const newSessions = [];
    let t1idx = 0, t2idx = 0;

    // Semaine par semaine
    let ws = new Date(startDate);
    ws.setDate(ws.getDate() - ws.getDay() + 1); // lundi

    while (ws < END) {
        const isPostT1 = ws >= T1;
        const n = isPostT1 ? 20 : sessionsPerWeek(ws);
        const slots = scheduleWeek(ws, n);
        const priority = isPostT1 ? t2sorted : t1sorted;
        const idxRef = isPostT1 ? 't2' : 't1';

        // Ajouter des samedis simultanés les dernières semaines
        const wToT1 = (T1 - ws) / (7 * 86400000);
        if (!isPostT1 && wToT1 <= 6) {
            const extra = wToT1 <= 3 ? 2 : 1;
            for (let i = 0; i < extra; i++) {
                const sam = new Date(ws);
                sam.setDate(sam.getDate() + (6 - sam.getDay()));
                slots.push({ date: new Date(sam), isWeekend: true });
            }
        }

        for (const slot of slots) {
            if (slot.date < startDate || slot.date > END) continue;

            const idx = isPostT1 ? t2idx++ : t1idx++;
            const bid = priority[idx % priority.length];
            const s = bureauStats[bid];
            const isImm = s.lgts_immeubles > s.total_lgts * 0.4;
            const nMil = isPostT1 ? (slot.isWeekend ? 8 : 5) : militantsPerSession(slot.date, slot.isWeekend);
            const portes = nMil * (isImm ? PORTES_IMM : PORTES_PAV);

            const phase = isPostT1 ? 'Entre-deux-tours — Front républicain'
                : slot.date < INSCR_END ? 'Inscriptions + sensibilisation'
                : '1er tour — Vote utile Mélenchon';

            const top = s.top_immeubles || [];
            const cibles = top.length
                ? top.slice(0, 3).map(i => `${i.adr} (~${i.lgts} lgts)`).join(', ')
                : `Zone bureau ${bid}`;

            const isoDate = slot.date.toISOString().split('T')[0];

            newSessions.push({
                date: isoDate,
                bureau: parseInt(bid),
                phase: phase,
                type: slot.isWeekend ? 'Weekend' : 'Soir',
                adresses_cibles: cibles,
                portes_estimees: portes,
                statut: 'planned',
            });
        }
        ws.setDate(ws.getDate() + 7);
    }

    // Insérer par batches
    for (let i = 0; i < newSessions.length; i += 50) {
        const chunk = newSessions.slice(i, i + 50);
        await fetch(`${SB_URL}/rest/v1/sessions`, {
            method: 'POST', headers: SB_H, body: JSON.stringify(chunk)
        });
    }

    // Recharger
    const resp = await fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`, { headers: SB_H });
    sessions = await resp.json();

    btn.disabled = false;
    btn.textContent = 'Mettre à jour le planning';
    render();
}

// === RENDER ===
function render() {
    renderTimeline();
    renderStats();
    renderSessions();
}

function renderTimeline() {
    const total = END - START;
    const inscrW = (INSCR_END - START) / total * 100;
    const t1W = (T1 - INSCR_END) / total * 100;
    const t2W = (END - T1) / total * 100;
    const now = new Date();
    const nowW = Math.max(0, Math.min(100, (now - START) / total * 100));

    document.getElementById('timeline-bar').innerHTML = `
        <div class="timeline-phase inscr" style="width:${inscrW}%">Inscriptions</div>
        <div class="timeline-phase t1" style="width:${t1W}%">1er tour</div>
        <div class="timeline-phase t2" style="width:${t2W}%">2nd tour</div>
        ${now >= START && now <= END ? `<div class="timeline-marker" style="left:${nowW}%"></div>` : ''}
    `;
    document.getElementById('timeline-dates').innerHTML =
        '<span>Sept 2026</span><span>Déc</span><span>Mars 2027</span><span>18 avr</span><span>30 avr</span>';
}

function renderStats() {
    const total = sessions.length;
    const portesTotal = sessions.reduce((s, x) => s + (x.portes_estimees || 0), 0);

    // Portes terrain (toutes les visites approuvées)
    let portesTerrain = 0;
    for (const [id, v] of Object.entries(visites)) {
        if (v.pap && v.pap.status === 'approved') {
            const a = addresses.find(x => x.id === id);
            portesTerrain += a ? (a.lgts || 1) : 1;
        }
    }

    // Bureaux couverts
    const bureauxWithVisits = new Set();
    for (const [id, v] of Object.entries(visites)) {
        if (v.pap && v.pap.status === 'approved') {
            const a = addresses.find(x => x.id === id);
            if (a && a._bureau) bureauxWithVisits.add(a._bureau);
        }
    }

    document.getElementById('stats').innerHTML = `
        <div class="stat-card">
            <div class="num">${total}</div>
            <div class="label">Sessions planifiées</div>
        </div>
        <div class="stat-card">
            <div class="num">${portesTotal.toLocaleString()}</div>
            <div class="label">Portes planifiées</div>
        </div>
        <div class="stat-card">
            <div class="num">${portesTerrain.toLocaleString()}</div>
            <div class="label">Portes faites (terrain)</div>
            <div class="bar"><div class="bar-fill green" style="width:${portesTotal ? portesTerrain/portesTotal*100 : 0}%"></div></div>
        </div>
        <div class="stat-card">
            <div class="num">${bureauxWithVisits.size}</div>
            <div class="label">Bureaux couverts</div>
        </div>
    `;
}

function renderSessions() {
    let html = '';
    let lastWeek = '';

    for (const s of sessions) {
        const d = new Date(s.date);
        const wn = Math.floor((d - START) / (7 * 86400000)) + 1;
        const wk = `S${wn}`;

        if (wk !== lastWeek) {
            const ws = new Date(START.getTime() + (wn - 1) * 7 * 86400000);
            const we = new Date(ws.getTime() + 6 * 86400000);
            const fmt = dt => `${dt.getDate()} ${MOIS[dt.getMonth()]}`;
            html += `<div class="week-header">${wk} — ${fmt(ws)} au ${fmt(we)}</div>`;
            lastWeek = wk;
        }

        const jour = JOURS[d.getDay()];
        const dateStr = `${jour} ${d.getDate()} ${MOIS[d.getMonth()]}`;
        const pClass = s.phase.includes('Inscr') ? 'inscr' : s.phase.includes('1er') ? 't1' : 't2';
        const phaseShort = s.phase.includes('Inscr') ? 'Inscriptions' : s.phase.includes('1er') ? '1er tour' : 'Front rép.';

        // Portes déjà faites dans ce bureau
        const fait = portesFaites(s.bureau);
        const bsInfo = bureauStats[s.bureau] || {};
        const totalBureau = (bsInfo.total_lgts || 0);
        const pctDone = totalBureau ? Math.min(100, Math.round(fait / totalBureau * 100)) : 0;

        html += `<div class="session-card">
            <div class="sc-top">
                <span class="sc-date">${dateStr} · ${s.type}</span>
                <span class="sc-badge ${pClass}">${phaseShort}</span>
            </div>
            <div class="sc-bureau">Bureau ${s.bureau}</div>
            <div class="sc-addr">${s.adresses_cibles || ''}</div>
            <div class="sc-portes"><b>${s.portes_estimees}</b> portes à faire</div>
            ${fait > 0 ? `<div class="sc-progress">
                <div class="bar"><div class="bar-fill" style="width:${pctDone}%"></div></div>
                <span class="pct">${pctDone}% couvert</span>
            </div>` : ''}
        </div>`;
    }

    document.getElementById('sessions').innerHTML = html || '<p style="padding:20px;color:#999;">Aucune session. Cliquez "Mettre à jour" pour générer le planning.</p>';
}

document.addEventListener('click', e => {
    if (!e.target.closest('.nav-menu-btn') && !e.target.closest('.nav-dropdown'))
        document.getElementById('nav-dropdown').classList.remove('open');
});

async function init() {
    await loadAll();
    render();
}
init();
</script>
</body>
</html>
