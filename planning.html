<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planning PAP — Nanterre</title>
<style>
@font-face { font-family: 'Union Gothic'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/union_gothic-variable.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'Stack Sans'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/StackSansText-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Stack Sans'; src: url('https://melenchon2027.fr/wp-content/uploads/2026/04/StackSansText-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
:root {
    --lfi-violet: #4C0297; --lfi-red: #D1271C; --lfi-yellow: #FFD301;
    --lfi-noir: #212320; --lfi-blanc: #FFFCF4; --lfi-gris: #F5F5F5;
    --lfi-gris2: #707070; --lfi-violet-light: #E5CBFF; --lfi-red-light: #FFD2CF;
    --lfi-green: #186842; --lfi-green-light: #EDFBF3; --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Stack Sans', Arial, sans-serif; color: var(--lfi-noir); background: var(--lfi-blanc); }
.header { background: var(--lfi-violet); color: white; padding: 16px 20px 12px; }
.header h1 { font-family: 'Union Gothic', sans-serif; font-size: 22px; text-transform: uppercase; }
.header .sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }
.timeline { padding: 12px 20px; background: white; border-bottom: 1px solid #eee; overflow-x: auto; }
.timeline-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; min-width: 500px; position: relative; }
.timeline-phase { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; white-space: nowrap; }
.timeline-phase.inscr { background: var(--lfi-red); }
.timeline-phase.t1 { background: var(--lfi-violet); }
.timeline-phase.t2 { background: var(--lfi-noir); }
.timeline-marker { position: absolute; top: -4px; width: 3px; height: 36px; background: var(--lfi-yellow); border-radius: 2px; }
.timeline-dates { font-size: 10px; color: var(--lfi-gris2); margin-top: 4px; display: flex; justify-content: space-between; min-width: 500px; }
.stats { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; }
.stat-card { flex: 1; min-width: 80px; background: white; border: 1.5px solid var(--lfi-violet-light); border-radius: var(--radius); padding: 10px; text-align: center; }
.stat-card .num { font-family: 'Union Gothic', sans-serif; font-size: 24px; color: var(--lfi-violet); }
.stat-card .label { font-size: 10px; color: var(--lfi-gris2); margin-top: 2px; }
.update-row { padding: 10px 20px; }
.update-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius); background: var(--lfi-violet); color: white; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(76,2,151,0.3); }
.update-btn:active { transform: scale(0.98); }
.update-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.sessions { padding: 0 20px 100px; }
.week-header { font-family: 'Union Gothic', sans-serif; font-size: 15px; color: var(--lfi-violet); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--lfi-violet-light); }
.session-card { background: white; border: 1.5px solid #eee; border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px; }
.sc-top { display: flex; justify-content: space-between; align-items: center; }
.sc-date { font-weight: 700; font-size: 14px; }
.sc-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.sc-badge.inscr { background: var(--lfi-red-light); color: var(--lfi-red); }
.sc-badge.t1 { background: var(--lfi-violet-light); color: var(--lfi-violet); }
.sc-badge.t2 { background: #eee; color: var(--lfi-noir); }
.sc-badge.p1 { background: var(--lfi-green-light); color: var(--lfi-green); }
.sc-badge.p2 { background: #FFF3E0; color: #E65100; }
.sc-bureau { font-size: 12px; color: var(--lfi-gris2); margin-top: 3px; }
.sc-addrs { font-size: 12px; margin-top: 4px; line-height: 1.5; }
.sc-addrs .addr-item { padding: 2px 0; }
.sc-addrs .addr-lgts { color: var(--lfi-gris2); }
.sc-summary { font-size: 12px; color: var(--lfi-gris2); margin-top: 4px; }
.sc-summary b { color: var(--lfi-noir); }
.nav-menu-btn { position: fixed; top: 10px; right: 10px; z-index: 10000; width: 44px; height: 44px; border: 1.5px solid var(--lfi-violet-light); border-radius: 50%; background: rgba(255,252,244,0.95); color: var(--lfi-violet); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(76,2,151,0.2); }
.nav-dropdown { display: none; position: fixed; top: 62px; right: 10px; z-index: 10000; background: rgba(255,252,244,0.97); border-radius: 10px; border: 1.5px solid var(--lfi-violet-light); box-shadow: 0 4px 16px rgba(76,2,151,0.2); overflow: hidden; min-width: 160px; }
.nav-dropdown.open { display: block; }
.nav-dropdown a { display: block; padding: 12px 16px; color: var(--lfi-violet); text-decoration: none; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--lfi-violet-light); }
.nav-dropdown a:last-child { border-bottom: none; }
.nav-dropdown a:hover { background: var(--lfi-violet-light); }
.nav-dropdown a.current { background: var(--lfi-violet); color: white; }
.nav-dropdown .nav-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 8px 16px; color: var(--lfi-gris2); border-bottom: 1px solid var(--lfi-violet-light); }
</style>
</head>
<body>
<div class="header">
    <h1>Planning PAP</h1>
    <div class="sub">Nanterre — Présidentielles 2027</div>
</div>
<div class="timeline"><div class="timeline-bar" id="tbar"></div><div class="timeline-dates" id="tdates"></div></div>
<div class="stats" id="stats"></div>
<div class="update-row"><button class="update-btn" id="ubtn" onclick="recalculate()">Mettre à jour le planning</button></div>
<div class="sessions" id="sessions"></div>
<button class="nav-menu-btn" onclick="document.getElementById('nav-dropdown').classList.toggle('open')">&#9776;</button>
<div class="nav-dropdown" id="nav-dropdown">
    <div class="nav-badge">Navigation</div>
    <a href="porte-a-porte.html?mode=admin">Terrain</a>
    <a href="1er_tour.html">Carte 1er tour</a>
    <a href="2nd_tour.html">Carte 2nd tour</a>
    <a href="planning.html" class="current">Planning</a>
</div>
<script>
const SB_URL = 'https://htprfzzqjqfzyqcbjynz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cHJmenpxanFmenlxY2JqeW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTI1MTEsImV4cCI6MjA5OTg2ODUxMX0.HtHvc7_OGAidJ0XSnlKnx3d6tfrPTxbkFUaLsEv5nbE';
const SB_H = {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};

const START=new Date('2026-09-12'), T1=new Date('2027-04-18'), END=new Date('2027-04-30');
const INSCR_END=new Date('2027-03-07'), XMAS_S=new Date('2026-12-19'), XMAS_E=new Date('2027-01-04');
const PORTES_IMM=50, PORTES_PAV=20;
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS=['jan','fév','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

let sessions=[], addresses=[], bureauStats={}, visites={};

async function loadAll() {
    const [sR,vR,aR,bR] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`,{headers:SB_H}),
        fetch(`${SB_URL}/rest/v1/visites?select=*`,{headers:SB_H}),
        fetch('adresses_nanterre.json'), fetch('bureau_stats_calendrier.json'),
    ]);
    sessions = await sR.json();
    const vRows = await vR.json();
    if (Array.isArray(vRows)) vRows.forEach(r => {
        if (!visites[r.address_id]) visites[r.address_id] = {};
        visites[r.address_id][r.type] = {count:r.count||1, status:r.status||'approved'};
    });
    addresses = await aR.json();
    bureauStats = await bR.json();
}

// === ALGO DE PLANIFICATION (pool global, pas par bureau) ===
function visitCount(addrId) {
    const v = visites[addrId];
    if (!v || !v.pap || v.pap.status !== 'approved') return 0;
    return v.pap.count;
}

function dist(a,b) { return Math.sqrt((a.lat-b.lat)**2+(a.lon-b.lon)**2); }

const SEUIL_LGTS = 10;
const BASCULE_P2 = new Date('2027-02-01');

function buildPoolT1() {
    // Toutes les adresses 10+ lgts, triées par score_recup_bureau × logements
    // Pas de filtre par bureau — les meilleures adresses de toute la ville
    const pool = [];
    for (const a of addresses) {
        if (!a.bv || !bureauStats[a.bv]) continue;
        const lgts = a.lgts || 1;
        if (lgts < SEUIL_LGTS) continue;
        const bs = bureauStats[a.bv];
        pool.push({...a, score: bs.score_recup * lgts, bureau: a.bv});
    }
    pool.sort((a, b) => b.score - a.score);
    return pool;
}

function buildPoolT2() {
    // Toutes les adresses 10+ lgts, triées par gain_voix_bureau × logements
    const pool = [];
    for (const a of addresses) {
        if (!a.bv || !bureauStats[a.bv]) continue;
        const lgts = a.lgts || 1;
        if (lgts < SEUIL_LGTS) continue;
        const bs = bureauStats[a.bv];
        const scoreT2 = (bs.gain_voix || 0) * lgts;
        if (scoreT2 <= 0) continue;
        pool.push({...a, score: scoreT2, scoreT2, bureau: a.bv});
    }
    pool.sort((a, b) => b.score - a.score);
    return pool;
}

function pickSession(pool, capacity, usedZones) {
    if (!pool.length) return [];
    // Zone = grille ~200m pour diversifier
    let seedIdx=-1;
    for (let i=0;i<pool.length;i++) {
        const z=`${Math.round(pool[i].lat*500)}_${Math.round(pool[i].lon*500)}`;
        if (!usedZones.has(z)) { seedIdx=i; break; }
    }
    if (seedIdx<0) seedIdx=0;
    const seed=pool[seedIdx];
    const selected=[seed];
    const used=new Set([seedIdx]);
    let left=capacity-(seed.lgts||1);

    while (left>0 && used.size<pool.length) {
        const last=selected[selected.length-1];
        let bi=-1, bv=-Infinity;
        for (let i=0;i<pool.length;i++) {
            if (used.has(i)) continue;
            const d=dist(last,pool[i]);
            if (d>0.004) continue;
            const v=(pool[i].lgts||1)/(d+0.00005);
            if (v>bv) { bv=v; bi=i; }
        }
        if (bi<0) break;
        selected.push(pool[bi]);
        used.add(bi);
        left-=(pool[bi].lgts||1);
    }
    // Retirer du pool
    [...used].sort((a,b)=>b-a).forEach(i=>pool.splice(i,1));
    // Marquer la zone
    usedZones.add(`${Math.round(seed.lat*500)}_${Math.round(seed.lon*500)}`);
    return selected;
}

function sessionsPerWeek(d) {
    if (d>=XMAS_S && d<=XMAS_E) return 1;
    const w=(T1-d)/(7*864e5);
    if (w>28) return 3; if (w>20) return 3; if (w>12) return 5;
    if (w>4) return 10; return 20;
}
function milPerSession(d, isWe) {
    const w=(T1-d)/(7*864e5);
    if (isWe) return w>20?6:w>8?7:8;
    return w>20?3:w>8?4:5;
}

let weekCounter = 0;
function scheduleWeek(ws, n) {
    const slots = [];
    // Samedi toujours inclus
    const sam = new Date(ws); sam.setDate(sam.getDate()+(6-sam.getDay()));
    slots.push({date:new Date(sam), isWe:true});

    // Soirs lun-ven : rotation d'une semaine à l'autre
    // Semaine 0: lun, mer, ven | Semaine 1: mar, jeu | Semaine 2: lun, mer, ven | etc.
    const soirPatterns = [
        [1, 3],     // lun, mer
        [2, 5],     // mar, ven
        [3, 4],     // mer, jeu
        [1, 5],     // lun, ven
        [2, 4],     // mar, jeu
        [4, 5],     // jeu, ven
        [1, 2],     // lun, mar
        [3, 5],     // mer, ven
    ];
    const pattern = soirPatterns[weekCounter % soirPatterns.length];
    weekCounter++;

    for (const d of pattern) {
        const dt = new Date(ws);
        dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
        slots.push({date: new Date(dt), isWe: false});
    }

    // Si > 6 sessions : ajouter les jours manquants
    if (n > slots.length) {
        for (const d of [1,2,3,4,5]) {
            const dt = new Date(ws);
            dt.setDate(dt.getDate() + ((d - dt.getDay() + 7) % 7));
            if (!slots.some(s => s.date.getTime() === dt.getTime()))
                slots.push({date: new Date(dt), isWe: false});
        }
    }
    // Si > 6 sessions : dupliquer (sessions simultanées)
    if (n > 6) {
        const base = slots.filter(s => !s.isWe);
        for (const s of base) slots.push({date: new Date(s.date), isWe: false});
    }
    // Si > 12 : dimanche
    if (n > 12) {
        const dim = new Date(ws); dim.setDate(dim.getDate()+(7-dim.getDay()));
        slots.push({date: dim, isWe: true});
    }
    // Extra samedis simultanés en fin de campagne
    const wToT1 = (T1-ws)/(7*864e5);
    if (wToT1 <= 6 && wToT1 > 0) {
        const extra = wToT1 <= 3 ? 2 : 1;
        for (let i = 0; i < extra; i++) slots.push({date: new Date(sam), isWe: true});
    }
    return slots.slice(0, n);
}

async function recalculate() {
    const btn=document.getElementById('ubtn');
    btn.disabled=true; btn.textContent='Calcul en cours...';

    await fetch(`${SB_URL}/rest/v1/sessions?id=gt.0`,{method:'DELETE',headers:SB_H});

    const today=new Date(); today.setHours(0,0,0,0);
    const startDate = today > START ? today : START;
    // Phase 1 (sept → 18 avr) : P1 puis P2 avec 3 mois de délai
    // Phase 3 (18 → 30 avr) : adresses T2 pas dans T1
    const poolPhase1 = buildPoolT1();
    const p1PlannedDates = {}; // addrId -> date planifiée en P1
    const p2Used = new Set(); // adresses déjà planifiées en P2
    const GAP_MS = 90 * 24 * 3600 * 1000; // 3 mois en ms
    const t1Ids = new Set(poolPhase1.map(a => a.id));
    const poolPhase3 = buildPoolT2().filter(a => !t1Ids.has(a.id));

    const newSessions = [];
    let ws = new Date(startDate);
    ws.setDate(ws.getDate() - ws.getDay() + 1);

    while (ws < END) {
        if (ws.getTime()+6*864e5 < startDate.getTime()) { ws.setDate(ws.getDate()+7); continue; }

        const isPostT1 = ws >= T1;
        const n = isPostT1 ? 20 : sessionsPerWeek(ws);
        const slots = scheduleWeek(ws, n);
        const usedZones = new Set();

        for (const slot of slots) {
            if (slot.date < startDate || slot.date > END) continue;

            const nMil = milPerSession(slot.date, slot.isWe);
            let pool, passage, phaseLabel;
            if (isPostT1) {
                pool = poolPhase3; passage = 1;
                phaseLabel = 'Entre-deux-tours — Front républicain';
            } else {
                // Construire le pool P2 dynamique : adresses planifiées en P1 il y a 3+ mois
                const poolP2now = [];
                for (const [addrId, p1Date] of Object.entries(p1PlannedDates)) {
                    if (p2Used.has(addrId)) continue;
                    if (slot.date.getTime() - p1Date.getTime() >= GAP_MS) {
                        const a = addresses.find(x => x.id === addrId);
                        if (!a || (a.lgts||1) < SEUIL_LGTS) continue;
                        const bs = bureauStats[a.bv];
                        if (!bs) continue;
                        poolP2now.push({...a, score: bs.score_recup * (a.lgts||1), bureau: a.bv});
                    }
                }
                poolP2now.sort((a,b) => b.score - a.score);

                // Alterner P1 et P2 : P2 si disponible, sinon P1
                if (poolP2now.length > 0) {
                    pool = poolP2now; passage = 2;
                } else {
                    pool = poolPhase1; passage = 1;
                }
                phaseLabel = slot.date < INSCR_END ? 'Inscriptions + sensibilisation' : '1er tour — Vote utile Mélenchon';
            }
            if (!pool.length) continue;

            // Estimer la capacité : regarder le 1er candidat pour savoir si c'est immeuble ou pavillon
            const firstLgts = pool[0]?.lgts || 1;
            const capacity = nMil * (firstLgts >= 6 ? PORTES_IMM : PORTES_PAV);

            const selected = pickSession(pool, capacity, usedZones);
            if (!selected.length) continue;

            // Enregistrer les dates P1 et marquer les P2
            for (const a of selected) {
                if (passage === 1 && !isPostT1) {
                    p1PlannedDates[a.id] = new Date(slot.date);
                } else if (passage === 2) {
                    p2Used.add(a.id);
                }
            }

            const totalLgts = selected.reduce((s,a)=>s+(a.lgts||1),0);
            const addrList = selected.slice(0,5).map(a=>`${a.adr} (~${a.lgts||1})`).join(', ');
            const extra = selected.length>5 ? ` +${selected.length-5} adresses` : '';
            const bureau = selected[0].bureau;

            newSessions.push({
                date: slot.date.toISOString().split('T')[0],
                bureau, phase: phaseLabel,
                type: slot.isWe ? 'Weekend' : 'Soir',
                adresses_cibles: addrList + extra,
                portes_estimees: totalLgts,
                statut: 'planned',
                notes: `Passage ${passage} · ${selected.length} adresses · ${nMil} militants`,
            });
        }
        ws.setDate(ws.getDate()+7);
    }

    for (let i=0; i<newSessions.length; i+=50) {
        await fetch(`${SB_URL}/rest/v1/sessions`,{
            method:'POST', headers:SB_H, body:JSON.stringify(newSessions.slice(i,i+50))
        });
    }

    sessions = await (await fetch(`${SB_URL}/rest/v1/sessions?select=*&order=date`,{headers:SB_H})).json();
    btn.disabled=false; btn.textContent='Mettre à jour le planning';
    render();
}

// === RENDER ===
function render() { renderTimeline(); renderStats(); renderSessions(); }

function renderTimeline() {
    const total=END-START;
    const iW=(INSCR_END-START)/total*100, t1W=(T1-INSCR_END)/total*100, t2W=(END-T1)/total*100;
    const now=new Date(), nW=Math.max(0,Math.min(100,(now-START)/total*100));
    document.getElementById('tbar').innerHTML=`
        <div class="timeline-phase inscr" style="width:${iW}%">Inscriptions</div>
        <div class="timeline-phase t1" style="width:${t1W}%">1er tour</div>
        <div class="timeline-phase t2" style="width:${t2W}%">2nd tour</div>
        ${now>=START&&now<=END?`<div class="timeline-marker" style="left:${nW}%"></div>`:''}`;
    document.getElementById('tdates').innerHTML='<span>Sept 2026</span><span>Déc</span><span>Mars 2027</span><span>18 avr</span><span>30 avr</span>';
}

function renderStats() {
    const nSess=sessions.length;
    const portesP=sessions.reduce((s,x)=>s+(x.portes_estimees||0),0);
    let portesFaites=0;
    for (const [id,v] of Object.entries(visites)) {
        if (v.pap&&v.pap.status==='approved') { const a=addresses.find(x=>x.id===id); portesFaites+=a?(a.lgts||1):1; }
    }
    document.getElementById('stats').innerHTML=`
        <div class="stat-card"><div class="num">${nSess}</div><div class="label">Sessions</div></div>
        <div class="stat-card"><div class="num">${portesP.toLocaleString()}</div><div class="label">Portes planifiées</div></div>
        <div class="stat-card"><div class="num">${portesFaites.toLocaleString()}</div><div class="label">Portes terrain</div></div>`;
}

function renderSessions() {
    let html='', lastW='';
    for (const s of sessions) {
        const d=new Date(s.date);
        const wn=Math.floor((d-START)/(7*864e5))+1, wk=`S${wn}`;
        if (wk!==lastW) {
            const ws2=new Date(START.getTime()+(wn-1)*7*864e5);
            const we2=new Date(ws2.getTime()+6*864e5);
            const fmt=dt=>`${dt.getDate()} ${MOIS[dt.getMonth()]}`;
            html+=`<div class="week-header">${wk} — ${fmt(ws2)} au ${fmt(we2)}</div>`;
            lastW=wk;
        }
        const jour=JOURS[d.getDay()], dateStr=`${jour} ${d.getDate()} ${MOIS[d.getMonth()]}`;
        const pCls=s.phase.includes('Inscr')?'inscr':s.phase.includes('1er')?'t1':'t2';
        const pShort=s.phase.includes('Inscr')?'Inscriptions':s.phase.includes('1er')?'1er tour':'Front rép.';
        const passageNum = s.notes && s.notes.includes('Passage 2') ? 2 : 1;

        html+=`<div class="session-card">
            <div class="sc-top">
                <span class="sc-date">${dateStr} · ${s.type}</span>
                <span class="sc-badge ${pCls}">${pShort}</span>
            </div>
            <div class="sc-top" style="margin-top:2px;">
                <span class="sc-bureau">Bureau ${s.bureau}</span>
                <span class="sc-badge ${passageNum===1?'p1':'p2'}">Passage ${passageNum}</span>
            </div>
            <div class="sc-addrs">${(s.adresses_cibles||'').split(', ').map(a=>`<div class="addr-item">${a}</div>`).join('')}</div>
            <div class="sc-summary"><b>${s.portes_estimees}</b> logements · ${s.notes||''}</div>
        </div>`;
    }
    document.getElementById('sessions').innerHTML=html||'<p style="padding:20px;color:#999;">Cliquez "Mettre à jour" pour générer le planning.</p>';
}

document.addEventListener('click',e=>{
    if(!e.target.closest('.nav-menu-btn')&&!e.target.closest('.nav-dropdown'))
        document.getElementById('nav-dropdown').classList.remove('open');
});

async function init() { await loadAll(); render(); }
init();
</script>
